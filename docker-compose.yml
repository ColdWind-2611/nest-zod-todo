services:
  db:
    image: postgres:17-alpine
    container_name: stage2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # 仅本地学习用；绝不等于生产写法
      POSTGRES_DB: stage2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stage2"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
